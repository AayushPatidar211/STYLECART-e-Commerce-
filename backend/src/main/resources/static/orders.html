<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order History — StyleCart</title>
  <meta name="description" content="View your order history, track shipments, and review purchased garments.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <header id="site-header"></header>

  <main style="padding: 2.5rem 0 5rem;">
    <div class="container">
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
        <div>
          <h1 style="font-family: var(--font-serif); font-size: 2.25rem; font-weight: 800;">Your Order History</h1>
          <p id="orders-count-desc" style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">Track shipments, view receipts, and monitor delivery progress</p>
        </div>
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;" id="order-status-tabs">
          <button class="btn btn-secondary btn-sm active-tab" data-status="ALL">All Orders</button>
          <button class="btn btn-secondary btn-sm" data-status="PROCESSING">Processing</button>
          <button class="btn btn-secondary btn-sm" data-status="SHIPPED">Shipped</button>
          <button class="btn btn-secondary btn-sm" data-status="DELIVERED">Delivered</button>
          <button class="btn btn-secondary btn-sm" data-status="CANCELLED">Cancelled</button>
        </div>
      </div>

      <div id="orders-list-container" style="display: flex; flex-direction: column; gap: 1.5rem;">
        <!-- Injected via orders.js -->
      </div>

      <div id="no-orders-msg" style="display: none; text-align: center; padding: 5rem 1rem; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg);">
        <div style="font-size: 3rem; margin-bottom: 1rem;">📦</div>
        <h2 style="font-family: var(--font-serif); font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;">No orders found</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem;">You haven't placed any orders matching this filter yet.</p>
        <a href="products.html" class="btn btn-primary">Start Shopping &rarr;</a>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="js/orders.js"></script>
</body>
</html>
