<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Sign In — StyleCart</title>
  <meta name="description" content="Sign in to your StyleCart account or test with demo customer and administrator credentials.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <header id="site-header"></header>

  <main style="padding: 3rem 0 5rem;">
    <div class="container container-narrow" style="max-width: 480px;">
      <div class="card" style="padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
          <h1 style="font-family: var(--font-serif); font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem;">Sign In</h1>
          <p style="font-size: 0.85rem; color: var(--text-muted);">Access your orders, saved wishlist, and address book</p>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-control" required placeholder="user@stylecart.com" />
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" id="login-password" class="form-control" required placeholder="••••••••" />
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
            Sign In to Account
          </button>
        </form>

        <!-- Quick Demo Testing Buttons -->
        <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border);">
          <span style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); display: block; text-align: center; margin-bottom: 0.75rem;">Instant Demo Accounts</span>
          <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <button id="btn-demo-user" class="btn btn-secondary btn-sm" style="width: 100%; justify-content: flex-start;">
              👤 Quick Login: <strong>Customer (Sarah Jenkins)</strong>
            </button>
            <button id="btn-demo-admin" class="btn btn-secondary btn-sm" style="width: 100%; justify-content: flex-start; border-color: #2563eb; color: #2563eb;">
              ★ Quick Login: <strong>Admin (Alexander Vance)</strong>
            </button>
          </div>
        </div>

        <div style="text-align: center; margin-top: 2rem; font-size: 0.85rem; color: var(--text-muted);">
          Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600; text-decoration: underline;">Create one now</a>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="js/auth-pages.js"></script>
</body>
</html>
