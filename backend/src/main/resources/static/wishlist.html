<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Wishlist — StyleCart</title>
  <meta name="description" content="View and manage your saved garments, curated pieces, and move items to your bag.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <header id="site-header"></header>

  <main style="padding: 2.5rem 0 5rem;">
    <div class="container">
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2rem;">
        <div>
          <h1 style="font-family: var(--font-serif); font-size: 2.25rem; font-weight: 800;">Saved Wardrobe Items</h1>
          <p id="wishlist-count-desc" style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">Curated pieces saved for later</p>
        </div>
        <a href="products.html" class="btn btn-secondary btn-sm">Continue Shopping &rarr;</a>
      </div>

      <div id="wishlist-empty-state" style="display: none; text-align: center; padding: 5rem 1rem; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg);">
        <div style="font-size: 3rem; margin-bottom: 1rem;">✨</div>
        <h2 style="font-family: var(--font-serif); font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;">Your wishlist is empty</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 2rem;">Save garments as you browse to keep track of seasonal favorites.</p>
        <a href="products.html" class="btn btn-primary">Browse New Arrivals &rarr;</a>
      </div>

      <div id="wishlist-grid" class="product-grid">
        <!-- Injected via wishlist-page.js -->
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="js/wishlist-page.js"></script>
</body>
</html>
