<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Profile & Addresses — StyleCart</title>
  <meta name="description" content="Manage your StyleCart profile, contact information, and default delivery addresses.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <header id="site-header"></header>

  <main style="padding: 2.5rem 0 5rem;">
    <div class="container container-narrow">
      <h1 style="font-family: var(--font-serif); font-size: 2.25rem; font-weight: 800; margin-bottom: 2rem;">
        Customer Account Settings
      </h1>

      <div style="display: grid; grid-template-columns: 1fr; gap: 2rem;">
        <!-- Account Overview Card -->
        <div class="card" style="padding: 2rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1.5rem;">
            <div>
              <h2 id="profile-display-name" style="font-size: 1.35rem; font-weight: 700;">Sarah Jenkins</h2>
              <span id="profile-email" style="font-size: 0.85rem; color: var(--text-muted);">user@stylecart.com</span>
            </div>
            <span id="profile-role-badge" class="badge badge-confirmed">ROLE_USER</span>
          </div>

          <form id="profile-address-form">
            <h3 style="font-family: var(--font-serif); font-size: 1.15rem; font-weight: 700; margin-bottom: 1rem;">Default Shipping Destination</h3>
            
            <div class="form-grid-2">
              <div class="form-group">
                <label class="form-label" for="prof-fullname">Full Name</label>
                <input type="text" id="prof-fullname" class="form-control" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="prof-phone">Phone Number</label>
                <input type="tel" id="prof-phone" class="form-control" required />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="prof-street">Street Address</label>
              <input type="text" id="prof-street" class="form-control" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="prof-apartment">Apartment / Suite</label>
              <input type="text" id="prof-apartment" class="form-control" />
            </div>

            <div class="form-grid-3">
              <div class="form-group">
                <label class="form-label" for="prof-city">City</label>
                <input type="text" id="prof-city" class="form-control" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="prof-state">State / Province</label>
                <input type="text" id="prof-state" class="form-control" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="prof-postal">Postal Code</label>
                <input type="text" id="prof-postal" class="form-control" required />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="prof-country">Country</label>
              <input type="text" id="prof-country" class="form-control" required />
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 1.5rem; margin-top: 1.5rem;">
              <a href="orders.html" class="btn btn-secondary btn-sm">View Order History &rarr;</a>
              <button type="submit" class="btn btn-primary">Save Delivery Address</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
